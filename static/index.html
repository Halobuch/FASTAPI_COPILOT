<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Generate</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        background: #f4f3ed;
        color: #242822;
      }

      body {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
      }

      main {
        width: min(100%, 760px);
        padding: clamp(24px, 6vw, 48px);
        border-top: 5px solid #bd4b32;
        background: #fffefa;
        box-shadow: 0 18px 50px #24282214;
      }

      h1 {
        margin: 0 0 24px;
        font-size: 2rem;
      }

      h2 {
        margin: 0 0 16px;
        font-size: 1.35rem;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font: 600 0.9rem Arial, sans-serif;
      }

      textarea,
      input {
        box-sizing: border-box;
        width: 100%;
        padding: 12px;
        border: 1px solid #a8ada3;
        border-radius: 4px;
        background: #fff;
        color: inherit;
        font: 1rem Arial, sans-serif;
      }

      textarea {
        min-height: 140px;
        line-height: 1.5;
        resize: vertical;
      }

      section {
        margin-top: 36px;
        padding-top: 24px;
        border-top: 1px solid #d7d9d1;
      }

      #products-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      #products-list li {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 0;
        border-bottom: 1px solid #e5e6e0;
        font: 1rem/1.4 Arial, sans-serif;
      }

      .product-description,
      .status {
        color: #60675f;
        font: 0.9rem/1.5 Arial, sans-serif;
      }

      .product-description {
        display: block;
        margin-top: 3px;
      }

      .product-price {
        flex: 0 0 auto;
        font-weight: 700;
      }

      #product-form {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(120px, 180px);
        gap: 14px;
        margin-top: 24px;
      }

      #product-form .description-field,
      #product-form button {
        grid-column: 1 / -1;
      }

      button {
        margin-top: 14px;
        padding: 11px 18px;
        border: 0;
        border-radius: 4px;
        background: #27665b;
        color: white;
        font: 600 0.95rem Arial, sans-serif;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.65;
        cursor: wait;
      }

      #result {
        min-height: 1.5em;
        margin-top: 22px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font: 1rem/1.5 Arial, sans-serif;
      }

      @media (max-width: 520px) {
        #product-form {
          grid-template-columns: 1fr;
        }

        #product-form .description-field,
        #product-form button {
          grid-column: auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Generate</h1>
      <form id="generate-form">
        <label for="prompt">Prompt</label>
        <textarea id="prompt" name="prompt" required></textarea>
        <button id="generate-button" type="submit">Generate</button>
      </form>
      <div id="result" role="status" aria-live="polite"></div>

      <section aria-labelledby="products-heading">
        <h2 id="products-heading">Products</h2>
        <p id="products-status" class="status" role="status" aria-live="polite">Loading products...</p>
        <ul id="products-list"></ul>

        <form id="product-form">
          <div>
            <label for="product-name">Name</label>
            <input id="product-name" name="name" required>
          </div>
          <div>
            <label for="product-price">Price</label>
            <input id="product-price" name="price" type="number" min="0" step="0.01" required>
          </div>
          <div class="description-field">
            <label for="product-description">Description</label>
            <input id="product-description" name="description">
          </div>
          <button id="add-product-button" type="submit">Add product</button>
        </form>
        <p id="product-form-status" class="status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script>
      const form = document.getElementById("generate-form");
      const promptField = document.getElementById("prompt");
      const button = document.getElementById("generate-button");
      const result = document.getElementById("result");
      const productForm = document.getElementById("product-form");
      const productList = document.getElementById("products-list");
      const productsStatus = document.getElementById("products-status");
      const productFormStatus = document.getElementById("product-form-status");
      const addProductButton = document.getElementById("add-product-button");

      async function loadProducts() {
        productsStatus.textContent = "Loading products...";

        try {
          const response = await fetch("/products");
          const products = await response.json();

          if (!response.ok) {
            throw new Error(products.detail ?? "Could not load products.");
          }

          productList.replaceChildren(...products.map((product) => {
            const item = document.createElement("li");
            const details = document.createElement("div");
            const name = document.createElement("strong");
            const description = document.createElement("span");
            const price = document.createElement("span");

            name.textContent = product.name;
            description.className = "product-description";
            description.textContent = product.description ?? "";
            price.className = "product-price";
            price.textContent = `$${Number(product.price).toFixed(2)}`;
            details.append(name, description);
            item.append(details, price);
            return item;
          }));
          productsStatus.textContent = `${products.length} product${products.length === 1 ? "" : "s"}`;
        } catch (error) {
          productsStatus.textContent = `Error: ${error.message}`;
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        button.disabled = true;
        result.textContent = "Sending request...";

        try {
          const response = await fetch("/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: promptField.value }),
          });
          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.detail ?? "The request failed.");
          }

          result.textContent = data.result;
        } catch (error) {
          result.textContent = `Error: ${error.message}`;
        } finally {
          button.disabled = false;
        }
      });

      productForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        addProductButton.disabled = true;
        productFormStatus.textContent = "Adding product...";

        const formData = new FormData(productForm);
        const product = {
          name: formData.get("name"),
          price: Number(formData.get("price")),
          description: formData.get("description") || null,
        };

        try {
          const response = await fetch("/products", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(product),
          });
          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.detail ?? "Could not add product.");
          }

          productForm.reset();
          productFormStatus.textContent = `Added ${data.name}.`;
          await loadProducts();
        } catch (error) {
          productFormStatus.textContent = `Error: ${error.message}`;
        } finally {
          addProductButton.disabled = false;
        }
      });

      loadProducts();
    </script>
  </body>
</html>
