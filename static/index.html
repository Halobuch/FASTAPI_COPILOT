<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Generate</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        background: #f4f3ed;
        color: #242822;
      }

      body {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
      }

      main {
        width: min(100%, 600px);
        padding: clamp(24px, 6vw, 48px);
        border-top: 5px solid #bd4b32;
        background: #fffefa;
        box-shadow: 0 18px 50px #24282214;
      }

      h1 {
        margin: 0 0 24px;
        font-size: 2rem;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font: 600 0.9rem Arial, sans-serif;
      }

      textarea {
        box-sizing: border-box;
        width: 100%;
        min-height: 140px;
        padding: 12px;
        border: 1px solid #a8ada3;
        border-radius: 4px;
        background: #fff;
        color: inherit;
        font: 1rem/1.5 Arial, sans-serif;
        resize: vertical;
      }

      button {
        margin-top: 14px;
        padding: 11px 18px;
        border: 0;
        border-radius: 4px;
        background: #27665b;
        color: white;
        font: 600 0.95rem Arial, sans-serif;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.65;
        cursor: wait;
      }

      #result {
        min-height: 1.5em;
        margin-top: 22px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font: 1rem/1.5 Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Generate</h1>
      <form id="generate-form">
        <label for="prompt">Prompt</label>
        <textarea id="prompt" name="prompt" required></textarea>
        <button id="generate-button" type="submit">Generate</button>
      </form>
      <div id="result" role="status" aria-live="polite"></div>
    </main>
    <script>
      const form = document.getElementById("generate-form");
      const promptField = document.getElementById("prompt");
      const button = document.getElementById("generate-button");
      const result = document.getElementById("result");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        button.disabled = true;
        result.textContent = "Sending request...";

        try {
          const response = await fetch("/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: promptField.value }),
          });
          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.detail ?? "The request failed.");
          }

          result.textContent = data.result;
        } catch (error) {
          result.textContent = `Error: ${error.message}`;
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
